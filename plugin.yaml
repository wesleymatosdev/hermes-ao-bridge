name: ao-bridge
version: 0.8.1
label: AO Bridge
description: Agent Orchestrator bridge — a Kanban board over the local AO daemon (projects, sessions, spawn, steer)
author: Wesley Matos
license: MIT
tags:
  - dashboard
  - agent-orchestrator
config_schema:
  ao_base_url:
    type: str
    default: http://127.0.0.1:3001
    description: Base URL of the local AO daemon REST API (loopback)
  open_in_ao_links:
    type: bool
    default: false
    description: Show the "Open in AO" deep-link buttons. Off by default — AO's open-url handler doesn't route session deep links yet (the app focuses but doesn't navigate); flip on once upstream AO handles session paths
  terminal_view:
    type: bool
    default: true
    description: Live terminal tab on the card detail sheet — attach to a worker's PTY through the AO daemon mux, with interactive input. Local-only, but it grants terminal input to your own worker sessions (see the README security table)
  relay_enabled:
    type: bool
    default: false
    description: Relay AO worker milestones into the owning orchestrator's Hermes session as live turns (opt-in; see README)
  relay_session:
    type: str
    default: ""
    description: OVERRIDE ONLY — Hermes session id for events whose orchestrator mapping cannot resolve; normal destinations are resolved per event from AO's orchestrator mapping (candidates at GET /api/plugins/ao-bridge/relay/sessions)
  relay_events:
    type: list
    default: []
    description: Event kinds to relay; empty means all (report_done, report_checkpoint, report_stuck, report_needs_input, session_idle, session_exited, session_terminated)
  relay_delivery:
    type: str
    default: auto
    description: Delivery route — auto (api_server when configured, else peer) | api_server | peer
  relay_api_url:
    type: str
    default: ""
    description: Gateway api_server base URL the relay delivers through; empty auto-detects from config.yaml api_server settings (loopback)
  relay_api_key:
    type: str
    default: ""
    description: Your gateway's API_SERVER_KEY, pasted here — authenticates the api_server delivery route (see the README's "Enable delivery" section)
  relay_peer:
    type: str
    default: ""
    description: OPTIONAL enhancement — peer name whose HERMES_PEER_<NAME>_KEY authenticates delivery when no api_server key is set (falls back to API_SERVER_KEY)
