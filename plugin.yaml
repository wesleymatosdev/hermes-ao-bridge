name: ao-bridge
version: 0.3.4
label: AO Bridge
description: Agent Orchestrator bridge — a Kanban board over the local AO daemon (projects, sessions, spawn, send)
author: Wesley Matos
license: MIT
tags:
  - dashboard
  - agent-orchestrator
config_schema:
  ao_base_url:
    type: str
    default: http://127.0.0.1:3001
    description: Base URL of the local AO daemon REST API (loopback)
  relay_enabled:
    type: bool
    default: false
    description: Relay AO worker milestones into the owning orchestrator's Hermes session as live turns (opt-in; see README)
  relay_session:
    type: str
    default: ""
    description: OVERRIDE ONLY — Hermes session id for events whose orchestrator mapping cannot resolve; normal destinations are resolved per event from AO's orchestrator mapping (candidates at GET /api/plugins/ao-bridge/relay/sessions)
  relay_events:
    type: list
    default: []
    description: Event kinds to relay; empty means all (report_done, report_checkpoint, report_stuck, report_needs_input, session_idle, session_exited, session_terminated)
  relay_api_url:
    type: str
    default: http://127.0.0.1:8642
    description: Gateway api_server base URL the relay delivers through (loopback)
  relay_peer:
    type: str
    default: ""
    description: Peer name whose HERMES_PEER_<NAME>_KEY authenticates delivery (scoped credential; falls back to API_SERVER_KEY when unset)
